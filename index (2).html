<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Card Skin</title>
<style>
:root{--bg:#000;--fg:#fff;--mute:rgba(255,255,255,.55);--blue:#2563eb;--gold1:#f4d98a;--gold2:#b98a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"SF Pro Display",Inter,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden}
#glow{position:absolute;left:50%;top:32%;width:380px;height:380px;margin:-190px 0 0 -190px;border-radius:50%;filter:blur(110px);opacity:.55;background:var(--glow,#555);transition:background .7s}
.screen{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:28px 20px;animation:in .38s ease both}
@keyframes in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
h1{margin:18px 0 0;text-align:center;font-size:clamp(22px,6vw,30px);line-height:1.25;font-weight:700}
h1 span{color:var(--mute)}
.stage{position:relative;width:100%;max-width:440px;touch-action:pan-y;user-select:none}
.tilt{perspective:1000px}
.card{position:relative;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out;filter:drop-shadow(0 28px 34px var(--glow,#000));will-change:transform}
.card img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.card .fx{position:absolute;inset:0;border-radius:3.9%/7%;overflow:hidden;pointer-events:none}
.glare{position:absolute;inset:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.55),rgba(255,255,255,0) 55%);mix-blend-mode:soft-light;opacity:var(--go,0);transition:opacity .25s}
.sheen{position:absolute;top:0;bottom:0;width:30%;left:-40%;transform:skewX(-14deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:sheen 3.4s ease-in-out 1s infinite}
@keyframes sheen{0%{left:-40%}55%,100%{left:130%}}
.go-l{animation:gol .42s cubic-bezier(.2,.8,.2,1) both}.go-r{animation:gor .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes gol{from{opacity:0;transform:translateX(-90px) rotate(-5deg)}to{opacity:1;transform:none}}
@keyframes gor{from{opacity:0;transform:translateX(90px) rotate(5deg)}to{opacity:1;transform:none}}
.arrow{position:absolute;top:50%;margin-top:-20px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);font-size:20px}
.arrow.l{left:-52px}.arrow.r{right:-52px}
@media(max-width:620px){.arrow{display:none}}
.name{margin:22px 0 0;text-align:center;font-size:15px;font-weight:600}
.dots{display:flex;gap:8px;justify-content:center}
.dots button{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.28);transition:all .3s}
.dots button.on{width:28px;background:#fff}
.btn{width:100%;max-width:380px;padding:16px;border-radius:18px;background:#fff;color:#000;font-weight:600;font-size:15px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(90deg,var(--gold1),var(--gold2));border-radius:999px;font-weight:700}
.spacer{flex:1}
.center{justify-content:center;gap:34px}
.title{font-size:24px;font-weight:700;margin:0}
.reader{position:relative;width:112px;height:112px;display:grid;place-items:center}
.reader .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(59,130,246,.7);animation:wave 2s ease-out infinite}
.reader .ring:nth-child(2){animation-delay:.65s}.reader .ring:nth-child(3){animation-delay:1.3s}
@keyframes wave{from{transform:scale(.7);opacity:.9}to{transform:scale(1.8);opacity:0}}
.reader .core{position:relative;width:96px;height:96px;border-radius:50%;border:3px solid #3b82f6;background:rgba(23,37,84,.6);display:grid;place-items:center;box-shadow:0 0 40px rgba(37,99,235,.5)}
.done{width:96px;height:96px;border-radius:50%;background:var(--blue);display:grid;place-items:center;box-shadow:0 0 50px rgba(37,99,235,.55);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.done path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .45s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.status{display:flex;flex-direction:column;align-items:center;gap:22px;animation:in .35s ease both}
.finale{background:linear-gradient(#0a0a12,#14102a);justify-content:center;gap:26px;text-align:center}
.fan{position:relative;width:100%;max-width:420px;height:220px}
.fan .c{position:absolute;top:30px;width:56%;opacity:.92}
.fan .c img{width:100%;display:block}
.fan .a{left:0;transform:rotate(-12deg)}.fan .b{right:0;transform:rotate(12deg)}
.fan .m{left:50%;top:0;width:62%;opacity:1;transform:translateX(-50%);animation:rise .8s cubic-bezier(.2,.9,.3,1.1) both;z-index:2;filter:drop-shadow(0 20px 30px rgba(0,0,0,.6))}
@keyframes rise{from{transform:translate(-50%,40px) scale(.9)}to{transform:translate(-50%,0)}}
.brand{margin:0;font-size:52px;font-weight:800;letter-spacing:-.02em}
.brand em{font-style:normal;background:linear-gradient(var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;max-width:300px;font-size:14px;font-weight:500;color:rgba(255,255,255,.8);line-height:1.45}
.small{margin:-12px 0 0;font-size:12px;color:var(--mute)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.wal{padding:0}.wh{padding:22px 20px 8px;text-align:center}.wh h1{margin:0}.wh p{margin:6px 0 0;color:var(--mute);font-size:13px}
.sc{flex:1;min-height:0;width:100%;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}.sc::-webkit-scrollbar{display:none}
.st{position:relative}
.wc{position:absolute;top:0;left:0;right:0;margin:0 auto;width:min(calc(100% - 40px),440px);cursor:pointer;transition:none;will-change:transform}
.st.anim .wc{transition:transform .7s cubic-bezier(.2,.85,.25,1)}
.wc .card{filter:none;will-change:auto;border-radius:3.9%/7%;box-shadow:0 -6px 14px rgba(0,0,0,.55)}
.wc.sel .card{filter:drop-shadow(0 28px 34px var(--glow));box-shadow:none;will-change:transform}
.wc:not(.sel) .sheen{display:none}
.panel{position:absolute;left:0;right:0;bottom:0;z-index:100;padding:36px 20px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:4px;background:linear-gradient(transparent,#000 40%);transform:translateY(115%);transition:transform .5s cubic-bezier(.2,.85,.25,1)}
.panel.on{transform:none}
.pname{margin:0;font-size:24px;font-weight:700}.pnum{margin:0 0 12px;color:var(--mute);font-size:13px}
.ghost{padding:10px;font-size:14px;color:var(--mute)}
#view{height:100%}
.wbtn{display:flex;align-items:center;gap:18px;width:100%;max-width:380px;height:72px;padding:0 28px 0 14px;border-radius:999px;background:linear-gradient(#2a2a2e,#151517);border:1px solid rgba(255,255,255,.09);box-shadow:0 12px 32px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);color:#fff;font-size:20px;font-weight:500;letter-spacing:-.01em;transition:transform .15s}
.wbtn:active{transform:scale(.97)}
.wbtn svg{flex:none}
.wbtn i{flex:none;width:1px;height:38px;background:rgba(255,255,255,.14)}
.wbtn span{flex:1;text-align:center}
</style>
</head>

};
function gen(d){
 const k=d.ink,f="font-family=\"-apple-system,Inter,sans-serif\"";
 return"data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"><defs><clipPath id="r"><rect width="640" height="400" rx="26"/></clipPath><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="ch" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4dc92"/><stop offset=".5" stop-color="#b8903a"/><stop offset="1" stop-color="#f5e2a1"/></linearGradient></defs><g clip-path="url(#r)">${ART[d.art]()}<rect width="640" height="400" fill="url(#gl)"/><rect x="1.5" y="1.5" width="637" height="397" rx="25" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="3"/><rect x="44" y="150" width="70" height="52" rx="9" fill="url(#ch)"/><path d="M44 176h70M79 150v52" stroke="#000" stroke-opacity=".3"/><path d="M150 164a18 18 0 0 1 0 24M164 156a30 30 0 0 1 0 40M178 148a42 42 0 0 1 0 56" fill="none" stroke="${k}" stroke-width="5" stroke-linecap="round"/><text x="44" y="312" fill="${k}" font-family="ui-monospace,Menlo,monospace" font-size="30" letter-spacing="4">4417 2086 1337 9021</text><text x="44" y="354" fill="${k}" ${f} font-size="20" letter-spacing="2" opacity=".85">${d.holder}</text><text x="596" y="62" text-anchor="end" fill="${k}" ${f} font-size="26" font-weight="700">${d.name}</text></g></svg>`)}
const GEN=[
 {name:"Holo Prism",art:"holo",ink:"#2a1f4d",glow:"rgba(180,150,255,.55)",holder:"IRIS VAN DER MEER"},
 {name:"Neon Grid",art:"neon",ink:"#22f2e6",glow:"rgba(255,43,214,.5)",holder:"K. NAKAMURA"},
 {name:"Nebula",art:"nebula",ink:"#f1e9ff",glow:"rgba(138,60,255,.55)",holder:"ORION VALE"},
 {name:"Magma",art:"magma",ink:"#ffd9a0",glow:"rgba(255,106,0,.5)",holder:"E. VULCANO"},
 {name:"Sakura",art:"sakura",ink:"#2d1f1c",glow:"rgba(240,150,170,.5)",holder:"H. TANAKA"},

{const RAW=SKINS.concat(GEN.map((d,k)=>({id:"g"+k,name:d.name,glow:d.glow,src:gen(d)})));SKINS=[0,4,5,12,1,13,6,7,2,14,8,9,3,10,11].map(k=>RAW[k]);}
const $=s=>document.querySelector(s),view=$("#view"),app=$("#app");
let i=0,timer=null;
const skin=()=>SKINS[i];
const setGlow=()=>app.style.setProperty("--glow",skin().glow);

const cardHTML=(s,cls="")=>`<div class="tilt ${cls}"><div class="card" style="--glow:${s.glow}"><img src="${s.src}" alt="${s.name}"><div class="fx"><i class="glare"></i><i class="sheen"></i></div></div></div>`;

function bindTilt(root){
 root.querySelectorAll(".tilt").forEach(t=>{
  const c=t.querySelector(".card");
  t.addEventListener("pointermove",e=>{
   const w=t.closest(".wc");if(w&&!w.classList.contains("sel"))return;const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
   c.style.setProperty("--ry",((x-.5)*28)+"deg");c.style.setProperty("--rx",((.5-y)*24)+"deg");
   c.style.setProperty("--gx",x*100+"%");c.style.setProperty("--gy",y*100+"%");c.style.setProperty("--go",1);
  });
  t.addEventListener("pointerleave",()=>{["--rx","--ry"].forEach(k=>c.style.setProperty(k,"0deg"));c.style.setProperty("--go",0)});
 });
}

function go(name){clearTimeout(timer);({pick,complete,reader,finale})[name]();}
function mount(html){view.innerHTML=html;setGlow();bindTilt(view);}

function pick(){
 const n=SKINS.length,S0=58,S1=172,H=(n-1)*S1+330;
 const WICON=`<svg width="48" height="48" viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#000"/><rect x="8" y="10" width="32" height="5" rx="2.5" fill="#34c759"/><rect x="8" y="16" width="32" height="5" rx="2.5" fill="#ffd60a"/><rect x="8" y="22" width="32" height="5" rx="2.5" fill="#ff9f0a"/><rect x="8" y="28" width="32" height="5" rx="2.5" fill="#ff453a"/><rect x="8" y="19" width="32" height="20" rx="4" fill="#fff"/><rect x="29" y="26" width="8" height="6" rx="3" fill="#cfcfd4"/><circle cx="32" cy="29" r="1.4" fill="#fff"/></svg>`;
 mount(`<div class="screen wal"><header class="wh"><h1>Ваши карты</h1><p>Листайте, чтобы раскрыть. Нажмите на карту.</p></header>
 <div class="sc" id="sc"><div class="st anim" id="st" style="height:${H}px">${SKINS.map((s,k)=>`<div class="wc" data-k="${k}" style="z-index:${k+1}">${cardHTML(s)}</div>`).join("")}</div></div>
 <div class="panel" id="pn"><p class="pname" id="pname"></p><p class="pnum" id="pnum"></p><button class="wbtn" id="ok">${WICON}<i></i><span>Preview in Wallet</span></button><button class="ghost" id="back">Назад</button></div></div>`);
 const sc=$("#sc"),st=$("#st"),wcs=[...st.querySelectorAll(".wc")];
 let sel=-1,pos=0,target=0,vel=0,raf=0,drag=null,moved=false,busy=true;
 const neutral=()=>app.style.setProperty("--glow","rgba(120,120,170,.35)");neutral();
 const maxP=()=>Math.max(0,H-sc.clientHeight);
 const clamp=v=>Math.max(0,Math.min(maxP(),v));
 const place=()=>{let acc=10-pos;
  wcs.forEach((w,k)=>{const y=sel<0?acc:(k===sel?14:sc.clientHeight+20+k*6);w.style.transform=`translateY(${y}px)`;
   const t=Math.max(0,Math.min(1,(pos-k*45)/260)),e=t*t*(3-2*t);acc+=S0+(S1-S0)*e})};
 const tick=()=>{
  if(!drag&&Math.abs(vel)>.05){target=clamp(target+vel);vel*=.94;if(target<=0||target>=maxP())vel=0}else if(!drag)vel=0;
  const d=target-pos;pos+=d*(drag?.5:.14);
  if(Math.abs(d)<.1&&Math.abs(vel)<.05&&!drag){pos=target;raf=0}else raf=requestAnimationFrame(tick);
  if(sel<0)place()};
 const kick=()=>{if(!raf)raf=requestAnimationFrame(tick)};
 wcs.forEach(w=>w.style.transform="translateY(900px)");
 requestAnimationFrame(()=>requestAnimationFrame(()=>{wcs.forEach((w,k)=>w.style.transitionDelay=k*45+"ms");place();
  setTimeout(()=>{wcs.forEach(w=>w.style.transitionDelay="0ms");st.classList.remove("anim");busy=false},1200)}));

  let dy=e.deltaY;if(e.deltaMode===1)dy*=32;else if(e.deltaMode===2)dy*=sc.clientHeight;
  target=clamp(target+dy);vel=0;kick()},{passive:false});
 let lastY=0,lastT=0;
 sc.addEventListener("pointerdown",e=>{if(busy||sel>=0)return;drag={id:e.pointerId,y0:e.clientY,t0:target,active:false};moved=false;lastY=e.clientY;lastT=performance.now();vel=0});
 sc.addEventListener("pointermove",e=>{if(!drag||e.pointerId!==drag.id)return;
  const dy=e.clientY-drag.y0;
  if(!drag.active){if(Math.abs(dy)<6)return;drag.active=true;moved=true;try{sc.setPointerCapture(e.pointerId)}catch(_){}sc.style.cursor="grabbing"}
  target=clamp(drag.t0-dy);
  const now=performance.now(),dt=Math.max(1,now-lastT);vel=vel*.6+(-(e.clientY-lastY)/dt*16)*.4;lastY=e.clientY;lastT=now;kick()});

  if(was&&performance.now()-lastT>80)vel=0;kick();setTimeout(()=>{moved=false},0)};

  wcs.forEach((w,j)=>w.classList.toggle("sel",j===k));place();setGlow();
  $("#pname").textContent=SKINS[k].name;$("#pnum").textContent=`Карта ${k+1} из ${n}`;$("#pn").classList.add("on")};

  place();neutral();$("#pn").classList.remove("on");busy=true;timer=setTimeout(()=>{st.classList.remove("anim");busy=false},800)};

 $("#back").onclick=close;$("#ok").onclick=()=>go("complete");
 onkeydown=e=>{if(e.key==="Escape"&&sel>=0)close();
  else if(sel<0&&!busy&&(e.key==="ArrowDown"||e.key==="ArrowUp")){target=clamp(target+(e.key==="ArrowDown"?140:-140));kick()}};
}

function complete(){
 mount(`<div class="screen center"><div style="width:100%;max-width:440px">${cardHTML(skin())}</div>
  <p class="title">Карта готова!!</p><button class="btn" id="add">Добавить в Wallet</button></div>`);

}

function reader(){
 mount(`<div class="screen"><div style="width:100%;max-width:440px;margin-top:14px">${cardHTML(skin())}</div>
  <div class="spacer"></div><div id="st"></div><div class="spacer"></div></div>`);

}

function finale(){
 const f=n=>SKINS[n].src;
 mount(`<div class="screen finale">
  <div class="fan"><div class="c a"><img src="${f((i+1)%SKINS.length)}" alt=""></div><div class="c b"><img src="${f((i+2)%SKINS.length)}" alt=""></div><div class="c m"><img src="${f(i)}" alt=""></div></div>
  <p class="title">Карта готова!!</p>
  <h2 class="brand">Card <em>Skin</em></h2>
  <p class="sub">Ваша настоящая карта — в том дизайне, который вам нравится.</p>
  <p class="small">100+ дизайнов · несколько касаний</p>
  <button class="btn gold" id="again">Смотреть Card Skin</button></div>`);

 $("#again").onclick=()=>go("pick");
}
pick();
